<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c17" />
      <stop offset="45%" stop-color="#0b162c" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.18)" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.18)" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 800; font-size: 50px; fill: #ffffff; letter-spacing: -1px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 600; font-size: 22px; fill: #34d399; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 400; font-size: 15px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .header-pill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11.5px; fill: #10b981; letter-spacing: 1.2px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="19" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Top Decorative Gradient Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- Decorative Right Mesh & Performance Dashboard Details -->
  <g opacity="0.16">
    <line x1="840" y1="45" x2="1140" y2="45" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="1140" y1="45" x2="1140" y2="315" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="840" y1="315" x2="1140" y2="315" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="840" y1="45" x2="840" y2="315" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Performance gauge arcs -->
    <path d="M890 190 A 80 80 0 0 1 1050 190" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6 4" />
    <path d="M910 190 A 60 60 0 0 1 1030 190" fill="none" stroke="#10b981" stroke-width="4" />
    <circle cx="970" cy="190" r="5" fill="#34d399" />
    <line x1="970" y1="190" x2="1010" y2="150" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />

    <!-- Storage Bar indicator -->
    <rect x="880" y="240" width="220" height="12" rx="6" fill="#1e293b" />
    <rect x="880" y="240" width="140" height="12" rx="6" fill="url(#accentGrad)" />
  </g>

  <!-- Left Hero Icon Graphic: Shield & Storage Booster -->
  <g transform="translate(80, 75)">
    <!-- Base Ring -->
    <circle cx="70" cy="70" r="66" fill="#0f172a" stroke="#059669" stroke-width="2.5" opacity="0.9" />
    <circle cx="70" cy="70" r="76" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7" />

    <!-- Shield Outline (Zero Harm Guarantee) -->
    <path d="M70 28 L104 42 C104 78 88 104 70 114 C52 104 36 78 36 42 Z" fill="#022c22" stroke="#10b981" stroke-width="2.5" opacity="0.85" />

    <!-- Hard Drive / Storage Disk Stack -->
    <g transform="translate(48, 50)">
      <!-- Disk 1 -->
      <path d="M4 14 C4 8 20 5 22 5 C24 5 40 8 40 14 C40 20 24 23 22 23 C20 23 4 20 4 14 Z" fill="#0f766e" opacity="0.6" />
      <rect x="4" y="14" width="36" height="10" rx="3" fill="#14b8a6" />
      <circle cx="10" cy="19" r="2" fill="#a7f3d0" />
      <!-- Disk 2 -->
      <rect x="4" y="28" width="36" height="10" rx="3" fill="#0d9488" />
      <circle cx="10" cy="33" r="2" fill="#34d399" filter="url(#glow)" />
      <!-- Speed Lightning in Shield -->
      <polygon points="26,18 20,29 25,29 21,39 31,27 25,27" fill="#fbbf24" filter="url(#glow)" />
    </g>
  </g>

  <!-- Main Content Block -->
  <g transform="translate(265, 58)">
    <!-- Header Top Pill -->
    <g transform="translate(0, 0)">
      <rect width="365" height="28" rx="14" fill="url(#badgeGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="14" r="4.5" fill="#10b981" />
      <text x="30" y="18.5" class="header-pill">WINDOWS 10 / 11 TUNING • ZERO-HARM GUARANTEED</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="74" class="title">WINDOWS CLEANUP &amp; OPTIMIZE</text>

    <!-- Subtitle -->
    <text x="0" y="114" class="subtitle">Windows 磁盘瘦身 • 弹窗静音 • 自启动清障 • 性能调优</text>

    <!-- Tagline -->
    <text x="0" y="146" class="tagline">Zero-Harm Architecture, Read-Only Telemetry First &amp; Multi-Tier Fact Card Delivery</text>

    <!-- Feature Pills Row -->
    <g transform="translate(0, 182)">
      <!-- Pill 1: 一键全景扫描 -->
      <g transform="translate(0, 0)">
        <rect width="166" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="13" y="21" class="badge-text">⚡ 全景扫描 (full_scan.ps1)</text>
      </g>
      <!-- Pill 2: 零伤害可回退 -->
      <g transform="translate(176, 0)">
        <rect width="152" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="13" y="21" class="badge-text">🛡️ 零伤害 / 100% 可回退</text>
      </g>
      <!-- Pill 3: IFEO 弹窗静音 -->
      <g transform="translate(338, 0)">
        <rect width="154" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="13" y="21" class="badge-text">🔇 IFEO 弹窗彻底静音</text>
      </g>
      <!-- Pill 4: 官方优先数据迁移 -->
      <g transform="translate(502, 0)">
        <rect width="156" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="13" y="21" class="badge-text">📁 官方优先数据迁移</text>
      </g>
      <!-- Pill 5: 分层体检事实卡 -->
      <g transform="translate(668, 0)">
        <rect width="146" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="13" y="21" class="badge-text">📊 分层体检事实卡</text>
      </g>
    </g>
  </g>
</svg>
